global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: django-api
    metrics_path: /internal/metrics/
    static_configs:
      - targets:
          - api:8000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: celery
    static_configs:
      - targets:
          - celery-exporter:9808

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080

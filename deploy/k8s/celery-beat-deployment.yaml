apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-celery-beat
  namespace: project-management
  labels:
    app.kubernetes.io/name: project-management
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management
        app.kubernetes.io/component: celery-beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: celery-beat
          image: ghcr.io/owner/repo/api:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --schedule=/tmp/celerybeat/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: project-management-config
            - secretRef:
                name: project-management-secret
          volumeMounts:
            - name: celerybeat
              mountPath: /tmp/celerybeat
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: celerybeat
          emptyDir:
            sizeLimit: 64Mi

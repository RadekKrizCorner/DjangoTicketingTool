apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-api
  namespace: project-management
  labels:
    app.kubernetes.io/name: project-management
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/owner/repo/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: project-management-config
            - secretRef:
                name: project-management-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          livenessProbe:
            httpGet:
              path: /api/v1/health/live/
              port: http
              httpHeaders:
                - name: Host
                  value: project-management-api
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: project-management-api
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: project-management-media

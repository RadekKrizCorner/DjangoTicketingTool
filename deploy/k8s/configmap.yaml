apiVersion: v1
kind: ConfigMap
metadata:
  name: project-management-config
  namespace: project-management
data:
  ATTACHMENT_MAX_FILE_SIZE_BYTES: "1048576"
  ATTACHMENT_MAX_PROJECT_BYTES: "20971520"
  ATTACHMENT_MAX_TOTAL_BYTES: "209715200"
  DEFAULT_FROM_EMAIL: "noreply@example.test"
  DJANGO_ALLOWED_HOSTS: "api.example.com,project-management-api,localhost,127.0.0.1"
  DJANGO_CORS_ALLOWED_ORIGINS: "https://app.example.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://api.example.com,https://app.example.com"
  DJANGO_HEALTHCHECK_HOST: "project-management-api"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_SETTINGS_MODULE: "config.settings.production"

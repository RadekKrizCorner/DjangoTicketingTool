apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-celery-worker
  namespace: project-management
  labels:
    app.kubernetes.io/name: project-management
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management
        app.kubernetes.io/component: celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: celery-worker
          image: ghcr.io/owner/repo/api:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
          envFrom:
            - configMapRef:
                name: project-management-config
            - secretRef:
                name: project-management-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: project-management-media

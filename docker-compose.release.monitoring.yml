services:
  api:
    environment:
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-true}
      OBSERVABILITY_SLOW_QUERY_SECONDS: ${OBSERVABILITY_SLOW_QUERY_SECONDS:-0.5}
      PUBLIC_GRAFANA_URL: ${PUBLIC_GRAFANA_URL:-https://grafana.radekkriz.space}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-512MB}
      - --web.enable-lifecycle
    expose:
      - "9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-overview.json
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SERVER_ROOT_URL: ${PUBLIC_GRAFANA_URL:-https://grafana.radekkriz.space}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3000}:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --redis.addr=redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

  celery-exporter:
    image: ${CELERY_EXPORTER_IMAGE:-danihodovic/celery-exporter:latest}
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      CE_BROKER_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    expose:
      - "9808"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --path.rootfs=/host
    expose:
      - "9100"
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    profiles:
      - monitoring
    expose:
      - "8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles:
      - cloudflare
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    environment:
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    labels:
      com.cloudflare.tunnel.public_hostname: grafana.radekkriz.space
      com.cloudflare.tunnel.service: http://grafana:3000
    depends_on:
      grafana:
        condition: service_started

volumes:
  grafana_data:
  prometheus_data:

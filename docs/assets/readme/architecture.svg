<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">RKRIZ backend architecture diagram</title>
  <desc id="desc">Diagram showing reviewer traffic into the Django REST API, a vertical stack of runtime dependencies, and a separate release path through GitHub Actions, GHCR, Docker Compose, and Kubernetes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>
  <rect x="58" y="56" width="1484" height="648" rx="32" fill="#ffffff" stroke="#dbe3ee"/>

  <text x="104" y="118" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a">System Architecture</text>
  <text x="104" y="152" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#64748b">API entry point, runtime dependencies, generated documentation, and release artifacts.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="850" y="118" font-size="18" font-weight="800" fill="#0f172a">Runtime dependencies</text>

    <g filter="url(#shadow)">
      <rect x="104" y="260" width="180" height="118" rx="22" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="194" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#075985">Reviewer</text>
      <text x="194" y="340" text-anchor="middle" font-size="15" fill="#0c4a6e">browser / client</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="390" y="232" width="280" height="174" rx="28" fill="#0f766e"/>
      <text x="530" y="286" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Django REST API</text>
      <text x="530" y="322" text-anchor="middle" font-size="17" fill="#ccfbf1">DRF resources</text>
      <text x="530" y="352" text-anchor="middle" font-size="17" fill="#ccfbf1">JWT authentication</text>
      <text x="530" y="382" text-anchor="middle" font-size="17" fill="#ccfbf1">permission boundaries</text>
    </g>

    <g font-size="15" filter="url(#shadow)">
      <rect x="850" y="138" width="278" height="58" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="989" y="162" text-anchor="middle" font-size="20" font-weight="800" fill="#3730a3">PostgreSQL</text>
      <text x="989" y="184" text-anchor="middle" fill="#4f46e5">project, task, and audit data</text>

      <rect x="850" y="210" width="278" height="58" rx="18" fill="#fef2f2" stroke="#fecaca"/>
      <text x="989" y="234" text-anchor="middle" font-size="20" font-weight="800" fill="#991b1b">Redis</text>
      <text x="989" y="256" text-anchor="middle" fill="#dc2626">Celery broker and cache</text>

      <rect x="850" y="282" width="278" height="58" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="989" y="306" text-anchor="middle" font-size="20" font-weight="800" fill="#166534">Celery Worker</text>
      <text x="989" y="328" text-anchor="middle" fill="#15803d">asynchronous jobs</text>

      <rect x="850" y="354" width="278" height="58" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="989" y="378" text-anchor="middle" font-size="20" font-weight="800" fill="#166534">Celery Beat</text>
      <text x="989" y="400" text-anchor="middle" fill="#15803d">scheduled workflows</text>

      <rect x="850" y="426" width="278" height="58" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="989" y="450" text-anchor="middle" font-size="20" font-weight="800" fill="#9a3412">Mailpit</text>
      <text x="989" y="472" text-anchor="middle" fill="#c2410c">local email inspection</text>

      <rect x="850" y="498" width="278" height="58" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="989" y="522" text-anchor="middle" font-size="20" font-weight="800" fill="#334155">Media Storage</text>
      <text x="989" y="544" text-anchor="middle" fill="#64748b">authorized attachments</text>

      <rect x="850" y="570" width="278" height="58" rx="18" fill="#faf5ff" stroke="#ddd6fe"/>
      <text x="989" y="594" text-anchor="middle" font-size="20" font-weight="800" fill="#6d28d9">OpenAPI Docs</text>
      <text x="989" y="616" text-anchor="middle" fill="#7c3aed">generated API contract</text>
    </g>
  </g>

  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 284 319 H 390"/>
    <path d="M 670 319 H 780 V 167 H 850"/>
    <path d="M 670 319 H 780 V 239 H 850"/>
    <path d="M 670 319 H 850"/>
    <path d="M 670 319 H 780 V 383 H 850"/>
    <path d="M 670 319 H 780 V 455 H 850"/>
    <path d="M 670 319 H 780 V 527 H 850"/>
    <path d="M 670 319 H 780 V 599 H 850"/>
  </g>

  <g transform="translate(104 658)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="-18" font-size="18" font-weight="800" fill="#0f172a">Release path</text>
    <g font-size="15" font-weight="800">
      <rect x="0" y="0" width="176" height="46" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="88" y="29" text-anchor="middle" fill="#1d4ed8">GitHub Actions</text>
      <path d="M 190 23 H 248" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="260" y="0" width="112" height="46" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="316" y="29" text-anchor="middle" fill="#334155">GHCR</text>
      <path d="M 386 23 H 444" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="456" y="0" width="210" height="46" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="561" y="29" text-anchor="middle" fill="#0e7490">Docker Compose</text>
      <path d="M 680 23 H 738" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="750" y="0" width="190" height="46" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="845" y="29" text-anchor="middle" fill="#3730a3">Kubernetes</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">RKRIZ Project Management Backend portfolio banner</title>
  <desc id="desc">Portfolio-style banner for a Django REST Framework project management backend with stack chips for Django, DRF, JWT, PostgreSQL, Redis, Celery, Docker, Kubernetes, GHCR, OpenAPI, and pytest.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbe3ee" stroke-width="1"/>
    </pattern>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="#f8fafc"/>
  <rect width="1600" height="520" fill="url(#grid)" opacity="0.52"/>
  <rect width="1600" height="520" fill="#ffffff" opacity="0.44"/>
  <rect x="92" y="70" width="1416" height="6" rx="3" fill="url(#stripe)"/>

  <g transform="translate(92 104)">
    <rect x="0" y="0" width="254" height="36" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="24" y="24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#075985" letter-spacing="1.4">BACKEND PORTFOLIO</text>

    <text x="0" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" fill="#0f172a">RKRIZ Project</text>
    <text x="0" y="162" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" fill="#0f172a">Management Backend</text>
    <text x="2" y="214" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#475569">Production-style Django REST API for authentication, permissions, tasks,</text>
    <text x="2" y="248" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#475569">attachments, auditability, notifications, async jobs, and deployment readiness.</text>

    <g transform="translate(0 304)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">
      <rect x="0" y="0" width="116" height="42" rx="21" fill="#092e20"/>
      <text x="58" y="27" text-anchor="middle" fill="#ffffff">Django</text>
      <rect x="132" y="0" width="88" height="42" rx="21" fill="#b91c1c"/>
      <text x="176" y="27" text-anchor="middle" fill="#ffffff">DRF</text>
      <rect x="236" y="0" width="94" height="42" rx="21" fill="#2563eb"/>
      <text x="283" y="27" text-anchor="middle" fill="#ffffff">JWT</text>
      <rect x="346" y="0" width="138" height="42" rx="21" fill="#4169e1"/>
      <text x="415" y="27" text-anchor="middle" fill="#ffffff">PostgreSQL</text>
      <rect x="500" y="0" width="104" height="42" rx="21" fill="#dc382d"/>
      <text x="552" y="27" text-anchor="middle" fill="#ffffff">Redis</text>
      <rect x="620" y="0" width="112" height="42" rx="21" fill="#37814a"/>
      <text x="676" y="27" text-anchor="middle" fill="#ffffff">Celery</text>
      <rect x="0" y="62" width="112" height="42" rx="21" fill="#2496ed"/>
      <text x="56" y="89" text-anchor="middle" fill="#ffffff">Docker</text>
      <rect x="128" y="62" width="142" height="42" rx="21" fill="#326ce5"/>
      <text x="199" y="89" text-anchor="middle" fill="#ffffff">Kubernetes</text>
      <rect x="286" y="62" width="100" height="42" rx="21" fill="#334155"/>
      <text x="336" y="89" text-anchor="middle" fill="#ffffff">GHCR</text>
      <rect x="402" y="62" width="126" height="42" rx="21" fill="#7c3aed"/>
      <text x="465" y="89" text-anchor="middle" fill="#ffffff">OpenAPI</text>
      <rect x="544" y="62" width="96" height="42" rx="21" fill="#0a9edc"/>
      <text x="592" y="89" text-anchor="middle" fill="#ffffff">pytest</text>
    </g>
  </g>
</svg>

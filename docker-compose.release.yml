services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/owner/repo/web:latest}
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-48137}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${APP_IMAGE:-ghcr.io/owner/repo/api:latest}
    restart: unless-stopped
    environment: &app_environment
      ATTACHMENT_MAX_FILE_SIZE_BYTES: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:-1048576}
      ATTACHMENT_MAX_PROJECT_BYTES: ${ATTACHMENT_MAX_PROJECT_BYTES:-20971520}
      ATTACHMENT_MAX_TOTAL_BYTES: ${ATTACHMENT_MAX_TOTAL_BYTES:-209715200}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.test}
      DEMO_SUPERUSER_DISPLAY_NAME: ${DEMO_SUPERUSER_DISPLAY_NAME:-Demo Admin}
      DEMO_SUPERUSER_EMAIL: ${DEMO_SUPERUSER_EMAIL:-demo.admin@example.com}
      DEMO_SUPERUSER_PASSWORD: ${DEMO_SUPERUSER_PASSWORD:-DemoAdmin123!}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoUser123!}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-radekkriz.space,www.radekkriz.space,localhost,127.0.0.1,api}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-localhost}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SETTINGS_MODULE: config.settings.production
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      HEALTH_REDIS_URL: redis://redis:6379/0
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-false}
      OBSERVABILITY_SLOW_QUERY_SECONDS: ${OBSERVABILITY_SLOW_QUERY_SECONDS:-0.5}
      PUBLIC_GRAFANA_URL: ${PUBLIC_GRAFANA_URL:-}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Host: $${DJANGO_HEALTHCHECK_HOST:-localhost}\" http://127.0.0.1:8000/api/v1/health/live/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    image: ${APP_IMAGE:-ghcr.io/owner/repo/api:latest}
    restart: unless-stopped
    command: celery -A config worker -l info
    environment: *app_environment
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  celery-beat:
    image: ${APP_IMAGE:-ghcr.io/owner/repo/api:latest}
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/app/celerybeat/celerybeat-schedule
    environment: *app_environment
    volumes:
      - celery_beat:/app/celerybeat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: ${APP_IMAGE:-ghcr.io/owner/repo/api:latest}
    profiles:
      - tools
    command: python manage.py migrate --noinput
    environment: *app_environment
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed-demo:
    image: ${APP_IMAGE:-ghcr.io/owner/repo/api:latest}
    profiles:
      - tools
    command: python manage.py seed_demo_data
    environment: *app_environment
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  celery_beat:
  media:
  postgres_data:
  redis_data:

name: Git Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate Git metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate merge request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/validate_commit_message.py --kind "merge request" --value "$PR_TITLE"

      - name: Validate branch targets
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: >
          python scripts/validate_commit_message.py
          --mode pull-request-target
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"

      - name: Validate commit titles
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"
          rev_list_options=""
          if [ "$BASE_REF" = "master" ] && [ "$HEAD_REF" = "release" ]; then
            # Release branches already validate original commits before merging.
            rev_list_options="--no-merges"
          fi
          for commit in $(git rev-list $rev_list_options "origin/$BASE_REF..HEAD"); do
            title="$(git log -1 --pretty=%s "$commit")"
            python scripts/validate_commit_message.py --kind commit --value "$title"
          done

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkriz-django-demo"
version = "0.1.0"
description = "Django project management backend."
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6.0",
  "dj-database-url>=2.2,<3.0",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.4,<5.0",
  "django-filter>=24.3,<25.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "drf-spectacular>=0.27,<1.0",
  "gunicorn>=22.0,<23.0",
  "psycopg[binary]>=3.2,<4.0",
  "prometheus-client>=0.21,<1.0",
  "python-decouple>=3.8,<4.0",
  "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-django>=4.9,<5.0",
  "pytest-kwparametrize>=0.0.3,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["docs*", "site*", "tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "e2e: end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]
ignore = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkriz-django-demo"
version = "0.1.0"
description = "Django project management backend."
requires-python = ">=3.14,<3.15"
dependencies = [
  "celery[redis]>=5.6,<6.0",
  "dj-database-url>=3.1,<4.0",
  "django>=6.0,<6.1",
  "django-cors-headers>=4.9,<5.0",
  "django-filter>=25.2,<26.0",
  "djangorestframework>=3.17,<4.0",
  "djangorestframework-simplejwt>=5.5,<6.0",
  "drf-spectacular>=0.29,<1.0",
  "gunicorn>=26.0,<27.0",
  "psycopg[binary]>=3.3,<4.0",
  "prometheus-client>=0.25,<1.0",
  "python-decouple>=3.8,<4.0",
  "whitenoise>=6.12,<7.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-django>=4.12,<5.0",
  "pytest-kwparametrize>=0.0.3,<1.0",
  "ruff>=0.15,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["docs*", "site*", "tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "e2e: end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]
ignore = []
